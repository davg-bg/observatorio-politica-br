name: ETL Daily

# Roda os ETLs da Fase 1 (deputados Câmara + senadores Senado) toda manhã.
# Também pode ser disparado manualmente com flags.
#
# Secrets necessários no repositório (Settings → Secrets → Actions):
#   DATABASE_URL                 Postgres connection string (pooler Supabase)
#   SUPABASE_URL                 (opcional, redundante com DATABASE_URL)
#   SUPABASE_SERVICE_ROLE_KEY    (reservado para Fase 4+)
#   TRANSPARENCIA_API_TOKEN      (reservado para Fase 4)
#
# NÃO definir SEV_LEVEL — leia os logs do workflow pra investigar falhas.

on:
  schedule:
    # 06:00 UTC = 03:00 BRT. Rodamos antes do pico de uso diurno.
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      target:
        description: 'Job ou grupo (ex: daily, camara-deputados, senado-senadores)'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - camara-deputados
          - senado-senadores
          - camara-votacoes
          - camara-proposicoes
          - camara-mps
          - stf-pautas
      dry_run:
        description: 'Dry-run (não grava no banco)'
        required: false
        default: false
        type: boolean
      skip_migrate:
        description: 'Pular aplicação de migrations antes do ETL'
        required: false
        default: false
        type: boolean

concurrency:
  group: etl-daily
  cancel-in-progress: false

jobs:
  etl:
    name: Executar ETL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/etl

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRANSPARENCIA_API_TOKEN: ${{ secrets.TRANSPARENCIA_API_TOKEN }}
      # Executa com logs estruturados mais verbosos
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL não configurada nos secrets do repositório"
            exit 1
          fi
          echo "DATABASE_URL configurada (${DATABASE_URL:0:30}…)"

      - name: Apply pending migrations
        if: ${{ github.event_name == 'schedule' || !inputs.skip_migrate }}
        run: uv run etl migrate

      - name: Run ETL (${{ inputs.target || 'daily' }})
        run: |
          TARGET="${{ inputs.target || 'daily' }}"
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          echo "Executando: etl run $TARGET $FLAGS"
          uv run etl run $TARGET $FLAGS

      - name: Summary
        if: always()
        run: |
          echo "### ETL Daily — ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Target: \`${{ inputs.target || 'daily' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dry-run: \`${{ inputs.dry_run || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
